<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙级3D卡牌抽取</title>
  <script>
    (function () {
      var waitBodyListenerBound = false;
      function ensureBox() {
        var box = document.getElementById('error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'error-box';
          box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;display:flex;flex-direction:column;gap:6px;pointer-events:none;';
          if (document.body) {
            document.body.appendChild(box);
          } else if (!waitBodyListenerBound) {
            waitBodyListenerBound = true;
            document.addEventListener('DOMContentLoaded', function () {
              if (!document.getElementById('error-box')) {
                document.body.appendChild(box);
              }
            }, { once: true });
          }
        }
        return box;
      }
      function showError(msg) {
        var item = document.createElement('div');
        item.textContent = '[错误] ' + msg;
        item.style.cssText = 'padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,#ff3b30,#ff9500);color:#fff;font-size:12px;font-family:monospace;box-shadow:0 8px 18px rgba(255,87,34,.35);';
        var box = ensureBox();
        box.appendChild(item);
        setTimeout(function () { item.remove(); }, 8000);
      }
      window.addEventListener('error', function (e) { showError(e.message || '未知脚本错误'); });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason || 'Promise未处理拒绝');
        showError(msg);
      });
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+SC:wght@400;600&display=swap');

    :root {
      --glass: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.2);
      --text: #e9ecff;
      --accent: #73f5ff;
      --pink: #ff78f3;
      --cursor: #73f5ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f245f 0%, #090b14 50%, #05060a 100%);
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #scene { width: 100%; height: 100%; display: block; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      z-index: 20;
    }
    .title {
      margin: 0;
      font-size: clamp(18px, 4vw, 32px);
      line-height: 1;
      font-family: "Orbitron", "Noto Sans SC", sans-serif;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, #88b8ff, #9ffff5, #d196ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(115, 245, 255, 0.5);
    }

    .stats-toggle {
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s;
      align-self: flex-end;
    }
    .stats-toggle:hover { background: rgba(255,255,255,0.2); }
    .stats.collapsed {
      padding: 6px;
      width: auto;
      min-width: 42px;
    }
    .stats.collapsed .stats-body { display: none; }

    .stats {
      position: fixed;
      top: 90px;
      right: 12px;
      width: min(280px, 72vw);
      z-index: 20;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
    .small { opacity: 0.8; font-size: 12px; }
    .btn {
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.18); }
    .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    #history {
      margin: 0;
      padding-left: 16px;
      max-height: 120px;
      overflow: auto;
      font-size: 12px;
    }
    .tool-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .deck-hud {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      z-index: 22;
      width: min(660px, calc(100vw - 24px));
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .deck-hud::before {
      content: '';
      position: absolute;
      left: -20%;
      right: -20%;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(115, 245, 255, 0.9), transparent);
      animation: scan 2.4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateX(-40%); }
      100% { transform: translateX(40%); }
    }
    .deck-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .deck-meta strong {
      font-family: "Orbitron", "Noto Sans SC", sans-serif;
      letter-spacing: 0.05em;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .deck-meta span {
      font-size: 12px;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .deck-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .deck-actions .btn {
      padding: 7px 10px;
      white-space: nowrap;
    }

    .gesture-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      z-index: 20;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: linear-gradient(90deg, rgba(117, 222, 255, 0.34), rgba(225, 122, 255, 0.28));
      color: #fff;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      touch-action: none;
    }

    #cursor {
      position: fixed;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: radial-gradient(circle, #fff 0%, var(--cursor) 55%, transparent 70%);
      box-shadow: 0 0 20px var(--cursor);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1);
      z-index: 30;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      bottom: 70px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(18, 22, 45, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 13px;
      z-index: 35;
      opacity: 0;
      transition: all .35s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .combo-display {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 25;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(40px, 8vw, 80px);
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
      white-space: nowrap;
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      z-index: 38;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s ease-out;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 4, 10, 0.92);
      color: #fff;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .progress-wrap {
      width: min(460px, 84vw);
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6ed9ff, #73ffcb, #ca7bff);
      transition: width .25s ease;
    }
    .hidden { display: none !important; }
    #camera { display: none; }
    #scene { touch-action: none; }

    @media (max-width: 640px) {
      .stats { top: 78px; width: calc(100% - 24px); }
      .stats.collapsed { width: auto; }
      .row { font-size: 12px; }
      .deck-hud {
        bottom: 72px;
        grid-template-columns: 1fr;
      }
      .deck-actions {
        width: 100%;
        justify-content: space-between;
      }
      .gesture-btn { bottom: 14px; }
    }

    .modal-box {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .album-card {
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      font-size: 12px;
      transition: transform .2s, box-shadow .2s;
      cursor: default;
      position: relative;
      overflow: hidden;
    }
    .album-card.collected {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .album-card.collected:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    .album-card.uncollected {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      filter: brightness(0.3);
    }
    .album-card .card-name {
      font-weight: 600;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .album-card .card-stars {
      font-size: 11px;
      margin-top: 2px;
    }
    .album-card .card-rarity {
      font-size: 10px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .fusion-slot {
      transition: border-color .2s, background .2s;
    }
    .fusion-slot:hover {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.05);
    }
    .fusion-slot.selected {
      border-style: solid;
      border-color: var(--accent);
      background: rgba(115,245,255,0.08);
    }

    .fusion-pick-card {
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      transition: background .15s, border-color .15s;
    }
    .fusion-pick-card:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--accent);
    }

    @keyframes eventPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes fusionGlow {
      0% { box-shadow: 0 0 10px rgba(115,245,255,0.3); }
      50% { box-shadow: 0 0 30px rgba(178,74,255,0.6), 0 0 60px rgba(115,245,255,0.3); }
      100% { box-shadow: 0 0 10px rgba(115,245,255,0.3); }
    }

    @keyframes resultGlow {
      0% { text-shadow: 0 0 8px currentColor; }
      50% { text-shadow: 0 0 24px currentColor, 0 0 48px currentColor; }
      100% { text-shadow: 0 0 8px currentColor; }
    }

    .glow-text {
      animation: resultGlow 1.5s ease-in-out infinite;
    }

    .detail-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }
    .detail-stat-row:last-child {
      border-bottom: none;
    }
    .detail-flavor {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      font-style: italic;
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
  </div>

  <header class="header glass">
    <h1 class="title">宇宙级 3D 卡牌抽取</h1>
  </header>

  <aside class="stats glass" id="statsPanel">
    <button id="statsToggle" class="stats-toggle" type="button" title="展开/收起面板">☰</button>
    <div class="stats-body">
    <div class="row">
      <label for="rainbowMode">彩虹卡开关</label>
      <input id="rainbowMode" type="checkbox" />
    </div>
    <div class="row">
      <label for="dampingSlider">手势阻尼</label>
      <input id="dampingSlider" type="range" min="1" max="10" value="5" style="width:100px;accent-color:#73f5ff;" />
      <span id="dampingValue" style="min-width:28px;text-align:right;">5</span>
    </div>
    <div class="row"><span>卡牌总数</span><strong id="cardTotal">0</strong></div>
    <div class="row"><span>当前展示</span><strong id="currentCard">--</strong></div>
    <div class="row"><span>抽卡记录</span><span class="small">最新5条</span></div>
    <ol id="history"></ol>
    <div class="tool-row">
      <button id="prevCardBtn" class="btn" type="button">上一张</button>
      <button id="nextCardBtn" class="btn" type="button">下一张</button>
      <button id="multiDrawBtn" class="btn" type="button">连抽3张</button>
    </div>
    <div class="tool-row">
      <button id="albumBtn" class="btn" type="button">图鉴</button>
      <button id="wheelBtn" class="btn" type="button">命运之轮</button>
      <button id="fusionBtn" class="btn" type="button">融合</button>
    </div>
    <div class="tool-row">
      <button id="detailBtn" class="btn" type="button">详情</button>
    </div>
    <button id="fullscreenBtn" class="btn" type="button">全屏切换</button>
    </div>
  </aside>

  <div id="deckHud" class="deck-hud glass">
    <div class="deck-meta">
      <strong id="focusTitle">轨道卡库：暂无卡牌</strong>
      <span id="gestureHint">调试提示：拖拽/滚轮/方向键可切卡；点击画面可抽卡</span>
    </div>
    <div class="deck-actions">
      <button id="hudPrevBtn" class="btn" type="button">◀ 轨道左滑</button>
      <button id="hudNextBtn" class="btn" type="button">轨道右滑 ▶</button>
    </div>
  </div>

  <button id="gestureBtn" class="gesture-btn" type="button">唤醒手势抽卡</button>
  <div id="cursor"></div>
  <div id="comboDisplay" class="combo-display"></div>
  <div id="screenFlash" class="screen-flash"></div>
  <div id="toast" class="toast"></div>
  <video id="camera" playsinline muted autoplay></video>

  <div id="loading" class="overlay">
    <h2>宇宙传送门构建中…</h2>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressText">准备资源 0%</div>
  </div>

  <div id="intro" class="overlay hidden">
    <h2>欢迎来到星际卡牌中心</h2>
    <p>可点击"跳过"立即进入，或等待动画自动结束。</p>
    <button id="skipIntro" class="btn" type="button">跳过</button>
  </div>

  <!-- 图鉴 Modal -->
  <div id="albumOverlay" class="overlay hidden" style="overflow-y:auto;">
    <div class="glass modal-box" style="width:min(700px,90vw);max-height:85vh;overflow-y:auto;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;font-family:'Orbitron','Noto Sans SC',sans-serif;font-size:20px;">卡牌图鉴</h2>
        <button id="albumCloseBtn" class="btn" type="button">关闭</button>
      </div>
      <div id="albumProgress" style="margin-bottom:12px;"></div>
      <div id="albumGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;"></div>
    </div>
  </div>

  <!-- 命运之轮 Modal -->
  <div id="wheelOverlay" class="overlay hidden">
    <div class="glass modal-box" style="width:min(440px,90vw);padding:20px;text-align:center;">
      <h2 style="margin:0 0 12px;font-family:'Orbitron','Noto Sans SC',sans-serif;font-size:20px;">命运之轮</h2>
      <canvas id="wheelCanvas" width="320" height="320" style="margin:0 auto;display:block;"></canvas>
      <div id="wheelResult" style="margin-top:12px;font-size:18px;font-weight:bold;min-height:28px;"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
        <button id="wheelSpinBtn" class="btn" type="button">旋转！</button>
        <button id="wheelCloseBtn" class="btn" type="button">关闭</button>
      </div>
      <div id="wheelCooldown" style="margin-top:6px;font-size:12px;opacity:0.7;"></div>
    </div>
  </div>

  <!-- 融合 Modal -->
  <div id="fusionOverlay" class="overlay hidden">
    <div class="glass modal-box" style="width:min(520px,90vw);padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;font-family:'Orbitron','Noto Sans SC',sans-serif;font-size:20px;">卡牌融合</h2>
        <button id="fusionCloseBtn" class="btn" type="button">关闭</button>
      </div>
      <p style="font-size:13px;opacity:0.8;margin-bottom:10px;">选择两张相同稀有度的卡牌进行融合，获得更高稀有度的卡牌！</p>
      <div id="fusionSelect" style="display:flex;gap:12px;justify-content:center;margin-bottom:12px;">
        <div id="fusionSlot1" class="fusion-slot" style="width:140px;height:200px;border:2px dashed rgba(255,255,255,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;opacity:0.7;">选择卡牌1</div>
        <div style="display:flex;align-items:center;font-size:28px;">⚡</div>
        <div id="fusionSlot2" class="fusion-slot" style="width:140px;height:200px;border:2px dashed rgba(255,255,255,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;opacity:0.7;">选择卡牌2</div>
      </div>
      <div style="text-align:center;">
        <button id="fusionGoBtn" class="btn" type="button" disabled>融合！</button>
      </div>
      <div id="fusionMsg" style="margin-top:8px;font-size:13px;text-align:center;min-height:20px;"></div>
      <div id="fusionRarityList" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 融合卡牌选择 Modal -->
  <div id="fusionPickOverlay" class="overlay hidden">
    <div class="glass modal-box" style="width:min(500px,90vw);max-height:80vh;overflow-y:auto;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:16px;">选择卡牌</h3>
        <button id="fusionPickCloseBtn" class="btn" type="button">取消</button>
      </div>
      <div id="fusionPickGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;"></div>
    </div>
  </div>

  <!-- 卡牌详情 Modal -->
  <div id="detailOverlay" class="overlay hidden">
    <div class="glass modal-box" style="width:min(420px,90vw);padding:20px;text-align:center;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;font-family:'Orbitron','Noto Sans SC',sans-serif;font-size:18px;">卡牌详情</h2>
        <button id="detailCloseBtn" class="btn" type="button">关闭</button>
      </div>
      <div id="detail3D" style="width:200px;height:300px;margin:0 auto;position:relative;"></div>
      <div id="detailInfo" style="margin-top:14px;text-align:left;"></div>
    </div>
  </div>

  <!-- 宇宙事件 Banner -->
  <div id="cosmicBanner" style="position:fixed;top:-80px;left:0;right:0;z-index:50;padding:14px 20px;text-align:center;font-size:16px;font-weight:bold;font-family:'Orbitron','Noto Sans SC',sans-serif;pointer-events:none;transition:top 0.5s cubic-bezier(0.22,1,0.36,1);"></div>

  <!-- 活跃事件指示器 -->
  <div id="eventIndicator" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:21;display:none;">
    <div class="glass" style="padding:6px 14px;border-radius:10px;font-size:12px;display:flex;align-items:center;gap:6px;">
      <span id="eventDot" style="width:8px;height:8px;border-radius:50%;display:inline-block;animation:eventPulse 1.2s infinite;"></span>
      <span id="eventLabel"></span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>

  <script>
    (function () {
    // ── 稀有度体系 ──
    const RARITY = {
      common:   { label: '普通', stars: 1, weight: 40, border: '#8a9bb0', glow: '#5a6a7a', bg1: '#0d1b2a', bg2: '#1b2d4a' },
      rare:     { label: '稀有', stars: 2, weight: 30, border: '#4a9eff', glow: '#2060cc', bg1: '#0a1e3d', bg2: '#163a6a' },
      epic:     { label: '史诗', stars: 3, weight: 18, border: '#b44aff', glow: '#7b20cc', bg1: '#1a0a3d', bg2: '#2e1660' },
      legendary:{ label: '传说', stars: 4, weight: 9,  border: '#ffc832', glow: '#cc8800', bg1: '#2a1a00', bg2: '#4a3200' },
      mythic:   { label: '神话', stars: 5, weight: 3,  border: '#ff3355', glow: '#cc0022', bg1: '#2a0010', bg2: '#550020' },
    };
    const RARITY_KEYS = Object.keys(RARITY);
    const TOTAL_WEIGHT = RARITY_KEYS.reduce((s, k) => s + RARITY[k].weight, 0);

    const CARD_POOL = [
      // ── 普通 1★ ──
      { name: '星尘',     rarity: 'common', flavor: '宇宙间最微小的光点，却是万物的起点。' },
      { name: '流星',     rarity: 'common', flavor: '划过天际的瞬间，承载着无数人的愿望。' },
      { name: '彗尾',     rarity: 'common', flavor: '冰与尘的舞蹈，在太阳风中绽放银色长裙。' },
      { name: '小行星',   rarity: 'common', flavor: '孤独的旅行者，在无尽的虚空中漂流。' },
      { name: '光斑',     rarity: 'common', flavor: '恒星表面的一缕微光，稍纵即逝却永恒存在。' },
      { name: '微光',     rarity: 'common', flavor: '黑暗中最温柔的坚持，照亮前行的方向。' },
      // ── 稀有 2★ ──
      { name: '星云',     rarity: 'rare', flavor: '恒星的摇篮，色彩斑斓的宇宙画卷。' },
      { name: '极光',     rarity: 'rare', flavor: '磁场与粒子的交响，天空最华丽的帷幕。' },
      { name: '日珥',     rarity: 'rare', flavor: '太阳的火焰之舞，炽热而壮美。' },
      { name: '星团',     rarity: 'rare', flavor: '千百颗恒星汇聚，编织出璀璨的宝石盒。' },
      { name: '暗物质',   rarity: 'rare', flavor: '看不见的力量，却维系着整个宇宙的秩序。' },
      // ── 史诗 3★ ──
      { name: '超新星',   rarity: 'epic', flavor: '恒星最后的怒吼，以毁灭照亮整个星系。' },
      { name: '黑洞边缘', rarity: 'epic', flavor: '时间在此凝滞，光也无法逃脱的深渊。' },
      { name: '脉冲星',   rarity: 'epic', flavor: '宇宙的心跳，精确到毫秒的星际灯塔。' },
      { name: '虫洞',     rarity: 'epic', flavor: '时空的捷径，连接两个未知世界的通道。' },
      // ── 传说 4★ ──
      { name: '银河核心', rarity: 'legendary', flavor: '万千星辰的归宿，银河系最神秘的心脏。' },
      { name: '时间裂缝', rarity: 'legendary', flavor: '过去与未来在此交汇，因果律在此瓦解。' },
      { name: '维度之门', rarity: 'legendary', flavor: '通往平行宇宙的入口，无限可能的起点。' },
      // ── 神话 5★ ──
      { name: '创世之光', rarity: 'mythic', flavor: '宇宙大爆炸的第一缕光，万物起源的见证。' },
      { name: '永恒奇点', rarity: 'mythic', flavor: '无限密度与无限时空的交汇，超越一切的存在。' },
    ];

    function rollRarity() {
      let r = Math.random() * TOTAL_WEIGHT;
      for (const key of RARITY_KEYS) {
        r -= RARITY[key].weight;
        if (r <= 0) return key;
      }
      return 'common';
    }

    function drawRandomCard() {
      const rarityKey = rollRarity();
      const candidates = CARD_POOL.filter(c => c.rarity === rarityKey);
      return candidates[Math.floor(Math.random() * candidates.length)] || CARD_POOL[0];
    }

    const RENDER_PIXEL_RATIO_CAP = 2;
    const STAR_COUNT = window.innerWidth < 768 ? 1800 : 2600;
    const CARD_DISPLAY_MS = 1500;
    const DRAW_COOLDOWN_MS = 900;
    const CARD_STACK_LIMIT = 36;
    const PROGRESS_STEP_MAX = 18;
    const PROGRESS_SOFT_CAP = 92;
    const HAND_DETECTION_CONFIDENCE = 0.6;
    const HAND_TRACKING_CONFIDENCE = 0.6;
    const PINCH_THRESHOLD = 0.05;
    const POINTER_SWIPE_THRESHOLD_PX = 34;
    const PALM_BURST_HOLD_MS = 900;
    const BURST_COOLDOWN_MS = 4200;
    const BURST_COUNT = 3;
    const STAR_FIELD_SIZE = 520;
    const DEFAULT_CARD_NAME = 'mystic';
    const CAMERA_WIDTH = 640;
    const CAMERA_HEIGHT = 480;
    const MOBILE_CAMERA_WIDTH = 480;
    const MOBILE_CAMERA_HEIGHT = 360;
    const PROGRESS_UPDATE_INTERVAL_MS = 220;
    const INTRO_AUTO_HIDE_MS = 3400;
    const TOAST_DISPLAY_MS = 1600;
    const FALLBACK_LOADING_HIDE_DELAY_MS = 260;
    const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const loadingEl = document.getElementById('loading');
    const introEl = document.getElementById('intro');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const skipBtn = document.getElementById('skipIntro');
    const gestureBtn = document.getElementById('gestureBtn');
    const prevCardBtn = document.getElementById('prevCardBtn');
    const nextCardBtn = document.getElementById('nextCardBtn');
    const multiDrawBtn = document.getElementById('multiDrawBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const currentCardEl = document.getElementById('currentCard');
    const focusTitleEl = document.getElementById('focusTitle');
    const gestureHintEl = document.getElementById('gestureHint');
    const hudPrevBtn = document.getElementById('hudPrevBtn');
    const hudNextBtn = document.getElementById('hudNextBtn');
    const dampingSliderEl = document.getElementById('dampingSlider');
    const dampingValueEl = document.getElementById('dampingValue');

    function enterFallbackMode(message) {
      progressBar.style.width = '100%';
      progressText.textContent = message;
      setTimeout(() => {
        loadingEl.classList.add('hidden');
      }, FALLBACK_LOADING_HIDE_DELAY_MS);
      introEl.classList.add('hidden');
      gestureBtn.disabled = true;
      gestureBtn.textContent = '手势不可用';
      const prev = document.getElementById('prevCardBtn');
      const next = document.getElementById('nextCardBtn');
      const multi = document.getElementById('multiDrawBtn');
      if (prev) prev.disabled = true;
      if (next) next.disabled = true;
      if (multi) multi.disabled = true;
      fullscreenBtn.disabled = true;
    }

    if (typeof window.THREE === 'undefined' || typeof window.gsap === 'undefined') {
      enterFallbackMode('关键资源(Three.js/GSAP)加载失败，已进入基础模式（请检查网络后刷新）');
      return;
    }

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, RENDER_PIXEL_RATIO_CAP));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);
    camera.position.set(0, 0, 38);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    const point = new THREE.PointLight(0x9dd6ff, 1.4, 250);
    point.position.set(8, 10, 12);
    scene.add(ambient, point);

    const starGeo = new THREE.BufferGeometry();
    const stars = [];
    const randCoord = () => (Math.random() - 0.5) * STAR_FIELD_SIZE;
    for (let i = 0; i < STAR_COUNT; i += 1) {
      stars.push(randCoord(), randCoord(), randCoord());
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.9, color: 0xbfd3ff, transparent: true, opacity: 0.8 });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    let composer = null;
    let bloomPass = null;
    try {
      composer = new THREE.EffectComposer(renderer);
      const renderPass = new THREE.RenderPass(scene, camera);
      bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.4, 0.3);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);
    } catch (error) {
      console.warn('后处理初始化失败，已降级为基础渲染：', error);
      composer = null;
      bloomPass = null;
    }

    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    function makeCardTexture(label, rarityKey, rainbowMode) {
      const r = RARITY[rarityKey] || RARITY.common;
      const cvs = document.createElement('canvas');
      cvs.width = 512;
      cvs.height = 768;
      const ctx = cvs.getContext('2d');

      // ── 背景渐变 ──
      if (rainbowMode) {
        const grd = ctx.createLinearGradient(0, 0, 512, 768);
        grd.addColorStop(0, '#4a1238');
        grd.addColorStop(0.33, '#1a2e55');
        grd.addColorStop(0.66, '#123a4a');
        grd.addColorStop(1, '#1a3a2e');
        ctx.fillStyle = grd;
      } else {
        const grd = ctx.createLinearGradient(0, 0, 0, 768);
        grd.addColorStop(0, r.bg1);
        grd.addColorStop(1, r.bg2);
        ctx.fillStyle = grd;
      }
      ctx.fillRect(0, 0, 512, 768);

      // ── 星空装饰粒子 ──
      ctx.save();
      for (let i = 0; i < 60; i++) {
        const sx = Math.random() * 512;
        const sy = Math.random() * 768;
        const sr = Math.random() * 1.6 + 0.3;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.4 + 0.1})`;
        ctx.fill();
      }
      ctx.restore();

      // ── 彩虹模式额外装饰 ──
      if (rainbowMode) {
        ctx.save();
        ctx.globalAlpha = 0.25;
        // 顶部粉色光带
        const g1 = ctx.createLinearGradient(0, 0, 512, 0);
        g1.addColorStop(0, '#ff6af6'); g1.addColorStop(1, 'transparent');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, 512, 200);
        // 中部蓝色光带
        const g2 = ctx.createLinearGradient(0, 250, 512, 500);
        g2.addColorStop(0, 'transparent'); g2.addColorStop(0.5, '#62dbff'); g2.addColorStop(1, 'transparent');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 250, 512, 250);
        // 底部绿色光带
        const g3 = ctx.createLinearGradient(0, 600, 512, 768);
        g3.addColorStop(0, 'transparent'); g3.addColorStop(1, '#7bffbb');
        ctx.fillStyle = g3;
        ctx.fillRect(0, 560, 512, 208);
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // ── 稀有度外框 ──
      const bw = 6;
      ctx.strokeStyle = r.border;
      ctx.lineWidth = bw;
      ctx.strokeRect(bw / 2, bw / 2, 512 - bw, 768 - bw);

      // ── 内框装饰线 ──
      ctx.strokeStyle = r.border + '44';
      ctx.lineWidth = 1;
      ctx.strokeRect(22, 22, 468, 724);

      // ── 四角装饰 ──
      const cornerSize = 28;
      ctx.strokeStyle = r.border;
      ctx.lineWidth = 2;
      [[28,28,1,1],[484,28,-1,1],[28,740,1,-1],[484,740,-1,-1]].forEach(([cx,cy,dx,dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy + dy * cornerSize);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + dx * cornerSize, cy);
        ctx.stroke();
      });

      // ── 顶部稀有度标签 ──
      ctx.fillStyle = r.border;
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(r.label, 36, 68);

      // ── 星星 ──
      const starY = 108;
      const starSpacing = 28;
      const starStartX = 36;
      const filledStar = '★';
      const emptyStar = '☆';
      ctx.font = '24px sans-serif';
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i < r.stars ? r.border : 'rgba(255,255,255,0.2)';
        ctx.fillText(i < r.stars ? filledStar : emptyStar, starStartX + i * starSpacing, starY);
      }

      // ── 横向分割线 ──
      ctx.strokeStyle = r.border + '55';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(36, 130);
      ctx.lineTo(476, 130);
      ctx.stroke();

      // ── 中央图标区域 (几何图形装饰) ──
      ctx.save();
      ctx.globalAlpha = 0.12;
      const iconR = 100;
      ctx.strokeStyle = r.border;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(256, 340, iconR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(256, 340, iconR * 0.6, 0, Math.PI * 2);
      ctx.stroke();
      // 六芒星
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(256, 340);
        ctx.lineTo(256 + Math.cos(a) * iconR, 340 + Math.sin(a) * iconR);
        ctx.stroke();
      }
      ctx.restore();

      // ── 神话级额外光环 ──
      if (rarityKey === 'mythic') {
        ctx.save();
        const pulseGrad = ctx.createRadialGradient(256, 340, 20, 256, 340, 180);
        pulseGrad.addColorStop(0, r.glow + '30');
        pulseGrad.addColorStop(0.5, r.glow + '10');
        pulseGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = pulseGrad;
        ctx.fillRect(0, 180, 512, 320);
        ctx.restore();
      }

      // ── 卡名 ──
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 52px sans-serif';
      ctx.shadowColor = r.glow;
      ctx.shadowBlur = rarityKey === 'mythic' ? 20 : rarityKey === 'legendary' ? 14 : 8;
      ctx.fillText(label, 256, 400);
      ctx.shadowBlur = 0;

      // ── 底部分割线 ──
      ctx.strokeStyle = r.border + '55';
      ctx.beginPath();
      ctx.moveTo(36, 640);
      ctx.lineTo(476, 640);
      ctx.stroke();

      // ── 底部信息 ──
      ctx.fillStyle = r.border + 'cc';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`NO.${String(Math.floor(Math.random() * 9999)).padStart(4, '0')}`, 36, 680);
      ctx.textAlign = 'right';
      ctx.fillText('COSMIC CARD', 476, 680);

      return new THREE.CanvasTexture(cvs);
    }

    function textureFromBase64(base64, fallbackLabel, rarityKey, rainbowMode) {
      if (!base64) {
        return makeCardTexture(fallbackLabel, rarityKey, rainbowMode);
      }
      const img = new Image();
      const tex = new THREE.Texture(img);
      img.onload = () => {
        tex.needsUpdate = true;
      };
      img.src = base64;
      return tex;
    }

    const historyEl = document.getElementById('history');
    const totalEl = document.getElementById('cardTotal');
    const toastEl = document.getElementById('toast');
    const rainbowModeEl = document.getElementById('rainbowMode');
    const statsPanel = document.getElementById('statsPanel');
    const statsToggleBtn = document.getElementById('statsToggle');
    const archiveCards = [];
    let focusIndex = -1;
    const collectedCards = new Set();

    if (isMobileDevice) statsPanel.classList.add('collapsed');
    statsToggleBtn.addEventListener('click', () => statsPanel.classList.toggle('collapsed'));
    dampingSliderEl.addEventListener('input', () => {
      dampingValueEl.textContent = dampingSliderEl.value;
      resetFilter();
    });

    // ══════════════════════════════════════════════
    //  🎵 Web Audio 音效系统
    // ══════════════════════════════════════════════
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playDrawSound(rarityKey) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        // 稀有度越高，音调越高越华丽
        const freqMap = { common: 220, rare: 330, epic: 440, legendary: 554, mythic: 660 };
        const baseFreq = freqMap[rarityKey] || 220;

        osc.type = rarityKey === 'mythic' ? 'sine' : rarityKey === 'legendary' ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * (rarityKey === 'mythic' ? 2.5 : 1.5), now + 0.15);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.start(now);
        osc.stop(now + 0.35);

        // 传说/神话加和弦
        if (rarityKey === 'legendary' || rarityKey === 'mythic') {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(baseFreq * 1.25, now);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2, now + 0.2);
          gain2.gain.setValueAtTime(0.08, now);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc2.start(now);
          osc2.stop(now + 0.45);
        }

        // 神话加第三音
        if (rarityKey === 'mythic') {
          const osc3 = ctx.createOscillator();
          const gain3 = ctx.createGain();
          osc3.connect(gain3);
          gain3.connect(ctx.destination);
          osc3.type = 'sine';
          osc3.frequency.setValueAtTime(baseFreq * 1.5, now + 0.05);
          osc3.frequency.exponentialRampToValueAtTime(baseFreq * 3, now + 0.25);
          gain3.gain.setValueAtTime(0.06, now + 0.05);
          gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc3.start(now + 0.05);
          osc3.stop(now + 0.55);
        }
      } catch (e) { /* 静默失败 */ }
    }

    function playComboSound(comboCount) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(300 + comboCount * 80, now);
        osc.frequency.exponentialRampToValueAtTime(600 + comboCount * 120, now + 0.08);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } catch (e) { /* 静默失败 */ }
    }

    // ══════════════════════════════════════════════
    //  💥 粒子爆炸系统
    // ══════════════════════════════════════════════
    const particleSystems = [];

    function spawnParticleBurst(worldPos, colorHex, count) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const velocities = [];
      const color = new THREE.Color(colorHex);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = worldPos.x;
        positions[i * 3 + 1] = worldPos.y;
        positions[i * 3 + 2] = worldPos.z;
        velocities.push({
          x: (Math.random() - 0.5) * 0.4,
          y: (Math.random() - 0.5) * 0.4 + 0.1,
          z: (Math.random() - 0.5) * 0.3 + 0.15,
        });
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.35,
        color,
        transparent: true,
        opacity: 1,
        depthWrite: false,
      });
      const points = new THREE.Points(geo, mat);
      scene.add(points);
      particleSystems.push({ points, velocities, life: 1.0, geo, mat });
    }

    function updateParticles(dt) {
      for (let i = particleSystems.length - 1; i >= 0; i--) {
        const ps = particleSystems[i];
        ps.life -= dt * 1.8;
        if (ps.life <= 0) {
          scene.remove(ps.points);
          ps.geo.dispose();
          ps.mat.dispose();
          particleSystems.splice(i, 1);
          continue;
        }
        ps.mat.opacity = ps.life;
        const pos = ps.points.geometry.attributes.position;
        for (let j = 0; j < ps.velocities.length; j++) {
          const v = ps.velocities[j];
          v.y -= dt * 0.6; // 重力
          pos.array[j * 3] += v.x;
          pos.array[j * 3 + 1] += v.y;
          pos.array[j * 3 + 2] += v.z;
        }
        pos.needsUpdate = true;
      }
    }

    // ══════════════════════════════════════════════
    //  🔥 连击系统 (Combo)
    // ══════════════════════════════════════════════
    let comboCount = 0;
    let comboTimer = null;
    const comboDisplayEl = document.getElementById('comboDisplay');
    const COMBO_TIMEOUT_MS = 2200;
    const COMBO_COLORS = ['#8a9bb0', '#4a9eff', '#b44aff', '#ffc832', '#ff3355'];

    function triggerCombo() {
      comboCount += 1;
      if (comboTimer) clearTimeout(comboTimer);
      comboTimer = setTimeout(() => { comboCount = 0; }, COMBO_TIMEOUT_MS);

      if (comboCount >= 2) {
        const colorIdx = Math.min(Math.floor((comboCount - 2) / 2), COMBO_COLORS.length - 1);
        const color = COMBO_COLORS[colorIdx];
        comboDisplayEl.textContent = `COMBO ×${comboCount}`;
        comboDisplayEl.style.color = color;
        gsap.killTweensOf(comboDisplayEl);
        gsap.fromTo(comboDisplayEl,
          { scale: 1.5, opacity: 1 },
          { scale: 0.8, opacity: 0, duration: 1.2, ease: 'power2.out' }
        );
        playComboSound(comboCount);
      }
    }

    // ══════════════════════════════════════════════
    //  ✨ 全屏闪光特效
    // ══════════════════════════════════════════════
    const screenFlashEl = document.getElementById('screenFlash');

    function triggerScreenFlash(colorHex) {
      screenFlashEl.style.background = `radial-gradient(circle at center, ${colorHex}66, ${colorHex}22, transparent 70%)`;
      screenFlashEl.style.opacity = '1';
      setTimeout(() => { screenFlashEl.style.opacity = '0'; }, 80);
      setTimeout(() => { screenFlashEl.style.opacity = '0.4'; }, 160);
      setTimeout(() => { screenFlashEl.style.opacity = '0'; }, 300);
    }

    // ══════════════════════════════════════════════
    //  🌌 星空视差
    // ══════════════════════════════════════════════
    let parallaxX = 0, parallaxY = 0;
    let targetParallaxX = 0, targetParallaxY = 0;

    canvas.addEventListener('pointermove', (e) => {
      targetParallaxX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetParallaxY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    canvas.addEventListener('pointerleave', () => {
      targetParallaxX = 0;
      targetParallaxY = 0;
    });

    let total = 0;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), TOAST_DISPLAY_MS);
    }

    function updateArchiveLabel() {
      if (focusIndex < 0 || !archiveCards[focusIndex]) {
        currentCardEl.textContent = '--';
        focusTitleEl.textContent = '轨道卡库：暂无卡牌';
        return;
      }
      const current = archiveCards[focusIndex];
      const r = RARITY[current.rarity];
      const stars = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
      currentCardEl.textContent = `${current.name} [${r.label} ${stars}]`;
      focusTitleEl.textContent = `轨道卡库：${focusIndex + 1}/${archiveCards.length} - ${current.name} [${r.label}]`;
    }

    function layoutArchiveCards(animate) {
      archiveCards.forEach((entry, index) => {
        const offset = index - focusIndex;
        const visible = Math.abs(offset) <= 8;
        entry.mesh.visible = visible;
        if (!visible) {
          return;
        }
        const targetPosition = {
          x: offset * 3.2,
          y: -7.3 + Math.min(Math.abs(offset) * 0.08, 0.5),
          z: -7.2 - Math.min(Math.abs(offset) * 1.45, 8.8)
        };
        const targetRotationY = offset * -0.26;
        const targetScale = offset === 0 ? 0.66 : Math.max(0.44, 0.6 - Math.abs(offset) * 0.04);
        entry.mat.emissive.setHex(offset === 0 ? parseInt(RARITY[entry.rarity].glow.slice(1), 16) : 0x0f1f31);
        const isRainbow = rainbowModeEl.checked;
        const rarityGlow = isRainbow ? 0.08 : (offset === 0 ? (RARITY[entry.rarity].stars * 0.18 + 0.15) : 0.26);
        entry.mat.emissiveIntensity = rarityGlow;
        entry.mat.roughness = isRainbow ? 0.55 : 0.38;
        entry.mat.opacity = offset === 0 ? 1 : Math.max(0.45, 1 - Math.abs(offset) * 0.12);

        if (animate) {
          gsap.to(entry.mesh.position, { ...targetPosition, duration: 0.5, ease: 'power2.out' });
          gsap.to(entry.mesh.rotation, { y: targetRotationY, x: 0, z: 0, duration: 0.5, ease: 'power2.out' });
          gsap.to(entry.mesh.scale, { x: targetScale, y: targetScale, z: targetScale, duration: 0.45, ease: 'power2.out' });
        } else {
          entry.mesh.position.set(targetPosition.x, targetPosition.y, targetPosition.z);
          entry.mesh.rotation.set(0, targetRotationY, 0);
          entry.mesh.scale.set(targetScale, targetScale, targetScale);
        }
      });
      updateArchiveLabel();
    }

    function focusCard(nextIndex, source) {
      if (!archiveCards.length) {
        updateArchiveLabel();
        return;
      }
      const capped = Math.max(0, Math.min(nextIndex, archiveCards.length - 1));
      if (capped === focusIndex) {
        return;
      }
      focusIndex = capped;
      layoutArchiveCards(true);
      if (source) {
        toast(`轨道切换：${archiveCards[focusIndex].name}`);
      }
    }

    function shiftFocus(delta, source) {
      if (!archiveCards.length) return;
      focusCard(focusIndex + delta, source);
    }

    function trimArchive() {
      while (archiveCards.length > CARD_STACK_LIMIT) {
        const removed = archiveCards.shift();
        cardGroup.remove(removed.mesh);
        removed.geo.dispose();
        removed.mat.dispose();
        removed.tex.dispose();
        focusIndex = Math.max(0, focusIndex - 1);
      }
    }

    function drawCard(source) {
      const rainbowMode = rainbowModeEl.checked;
      const cardData = patchedDrawRandomCard();
      const name = cardData.name;
      const rarityKey = cardData.rarity;
      const r = RARITY[rarityKey];
      const tex = textureFromBase64(null, name, rarityKey, rainbowMode);
      const geo = new THREE.PlaneGeometry(8, 12);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        metalness: rarityKey === 'mythic' ? 0.3 : rarityKey === 'legendary' ? 0.25 : 0.18,
        roughness: rainbowMode ? 0.55 : 0.38,
        emissive: rainbowMode ? 0x050810 : parseInt(r.glow.slice(1), 16),
        emissiveIntensity: rainbowMode ? 0.08 : (rarityKey === 'mythic' ? 0.6 : rarityKey === 'legendary' ? 0.5 : 0.35),
        transparent: true,
        opacity: 1
      });
      const card = new THREE.Mesh(geo, mat);
      // 卡牌从远处飞入，初始面朝下 (rotation.y = PI)
      card.position.set((Math.random() - 0.5) * 5, -3, -18);
      card.rotation.y = Math.PI; // 面朝下
      card.rotation.x = (Math.random() - 0.5) * 0.3;
      card.scale.set(0.3, 0.3, 0.3);
      cardGroup.add(card);
      archiveCards.push({ name, rarity: rarityKey, mesh: card, geo, mat, tex, createdAt: Date.now() });
      trimArchive();
      focusIndex = archiveCards.length - 1;

      // ── GSAP 翻转揭示动画 ──
      const tl = gsap.timeline();
      tl.to(card.position, { z: 1.5, y: 0.4, duration: 0.5, ease: 'power3.out' })
        .to(card.rotation, { y: 0, duration: 0.7, ease: 'elastic.out(1, 0.6)' }, '<')
        .to(card.rotation, { x: 0, duration: 0.4, ease: 'power2.out' }, '<0.1')
        .to(card.scale, {
          x: 0.66, y: 0.66, z: 0.66,
          duration: 0.4, ease: 'back.out(1.5)'
        }, '<');

      // 史诗+的额外弹跳
      if (rarityKey === 'epic' || rarityKey === 'legendary' || rarityKey === 'mythic') {
        const bounceScale = rarityKey === 'mythic' ? 0.75 : 0.72;
        tl.to(card.scale, { x: bounceScale, y: bounceScale, z: bounceScale, duration: 0.15, ease: 'sine.inOut', yoyo: true, repeat: 1 });
      }

      setTimeout(() => {
        layoutArchiveCards(true);
      }, CARD_DISPLAY_MS);

      // ── 💥 粒子爆炸 ──
      const particleCount = rarityKey === 'mythic' ? 120 : rarityKey === 'legendary' ? 80 : rarityKey === 'epic' ? 50 : 25;
      spawnParticleBurst(card.position.clone(), parseInt(r.border.slice(1), 16), particleCount);

      // ── 🔥 连击 ──
      triggerCombo();

      // ── 🎵 音效 ──
      playDrawSound(rarityKey);

      // ── ✨ 全屏闪光 (史诗+) ──
      if (rarityKey === 'epic' || rarityKey === 'legendary' || rarityKey === 'mythic') {
        triggerScreenFlash(r.border);
      }

      total += 1;
      totalEl.textContent = String(total);
      collectedCards.add(name);

      // ── Post-draw: Fortune boost & Cosmic events ──
      if (fortuneBoostRarity) {
        fortuneBoostRarity = null; // Reset after one draw
      }
      if (activeCosmicEvent) {
        if (activeCosmicEvent.drawsLeft !== null) {
          activeCosmicEvent.drawsLeft--;
          if (activeCosmicEvent.drawsLeft <= 0) {
            activeCosmicEvent = null;
            eventIndicator.style.display = 'none';
          }
        }
      }
      const stars = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
      const item = document.createElement('li');
      item.textContent = `${new Date().toLocaleTimeString()} - [${r.label}] ${name} ${stars}`;
      item.style.color = r.border;
      historyEl.prepend(item);
      while (historyEl.children.length > 5) {
        historyEl.lastElementChild.remove();
      }
      toast(`抽到 [${r.label}] ${name} ${stars}${source ? ` (${source})` : ''}！`);
      if (rarityKey === 'mythic' || rarityKey === 'legendary') {
        setTimeout(() => toast(`✦ ${r.label}级卡牌降临！✦`), TOAST_DISPLAY_MS + 200);
      }
      updateArchiveLabel();
    }

    function drawBurst(count, source) {
      for (let i = 0; i < count; i += 1) {
        setTimeout(() => {
          drawCard(source || '连抽');
        }, i * 140);
      }
    }

    function isFingerExtended(landmarks, tipIdx, pipIdx) {
      return landmarks[tipIdx].y < landmarks[pipIdx].y - 0.02;
    }

    function isOpenPalm(landmarks, pinchDist) {
      return pinchDist > PINCH_THRESHOLD * 1.8
        && isFingerExtended(landmarks, 8, 6)
        && isFingerExtended(landmarks, 12, 10)
        && isFingerExtended(landmarks, 16, 14)
        && isFingerExtended(landmarks, 20, 18);
    }

    let progress = 0;
    const timer = setInterval(() => {
      progress = Math.min(progress + Math.random() * PROGRESS_STEP_MAX, PROGRESS_SOFT_CAP);
      progressBar.style.width = `${progress.toFixed(0)}%`;
      progressText.textContent = `准备资源 ${progress.toFixed(0)}%`;
    }, PROGRESS_UPDATE_INTERVAL_MS);

    const LOADING_TIMEOUT_MS = 8000;
    function finishLoading() {
      if (finishLoading._done) return;
      finishLoading._done = true;
      clearInterval(timer);
      progress = 100;
      progressBar.style.width = '100%';
      progressText.textContent = '准备完成 100%';
      setTimeout(() => {
        loadingEl.classList.add('hidden');
        introEl.classList.remove('hidden');
        gsap.fromTo('.header, .stats, #gestureBtn, #deckHud', { y: -20, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.08, duration: 0.8 });
        setTimeout(() => introEl.classList.add('hidden'), INTRO_AUTO_HIDE_MS);
      }, 300);
    }
    window.addEventListener('load', finishLoading);
    setTimeout(finishLoading, LOADING_TIMEOUT_MS);

    skipBtn.addEventListener('click', () => {
      introEl.classList.add('hidden');
    });

    const cursor = document.getElementById('cursor');
    const videoElement = document.getElementById('camera');
    let cameraUtil = null;
    let mediaStream = null;
    let mediaPipeRafId = 0;
    let handEnabled = false;
    let isPinched = false;
    let canDraw = true;
    let lastTipX = null;
    let palmHoldSince = 0;
    let lastBurstAt = 0;

    // ══════════════════════════════════════════════
    //  🎯 手势平滑滤波器 (EMA + 速度计算)
    // ══════════════════════════════════════════════
    let smoothX = null, smoothY = null, smoothPinch = null;
    let swipeVelX = 0;           // 滑动速度 (归一化坐标/帧)
    let swipeAccum = 0;          // 累积滑动距离
    let swipeAccumTimer = 0;     // 累积重置计时
    let lastFilterTime = 0;
    const SWIPE_MULTITHRESHOLD = 0.04;  // 切一张卡的最小累积距离
    const SWIPE_ACCUM_TIMEOUT = 350;    // 累积超时 (ms)，超过则结算
    const SWIPE_MAX_CARDS = 8;          // 单次最多切几张

    function getSmoothingAlpha() {
      // slider 1~10 → alpha: 0.08(高阻尼/很平滑) ~ 0.65(低阻尼/灵敏)
      const v = parseInt(dampingSliderEl.value, 10);
      return 0.08 + (v - 1) * 0.063;
    }

    function getSwipeSensitivity() {
      // slider 1~10 → 灵敏度: 0.5(迟钝) ~ 2.0(灵敏)
      const v = parseInt(dampingSliderEl.value, 10);
      return 0.5 + (v - 1) * 0.167;
    }

    function applyFilter(rawX, rawY, rawPinch, dt) {
      const alpha = getSmoothingAlpha();
      if (smoothX === null) {
        smoothX = rawX; smoothY = rawY; smoothPinch = rawPinch;
      } else {
        smoothX += alpha * (rawX - smoothX);
        smoothY += alpha * (rawY - smoothY);
        smoothPinch += alpha * (rawPinch - smoothPinch);
      }
      return { x: smoothX, y: smoothY, pinch: smoothPinch };
    }

    function resetFilter() {
      smoothX = smoothY = smoothPinch = null;
      swipeVelX = 0;
      swipeAccum = 0;
      lastTipX = null;
    }

    function updateCursor(x, y, pinched) {
      cursor.style.opacity = '1';
      cursor.style.left = `${x * window.innerWidth}px`;
      cursor.style.top = `${y * window.innerHeight}px`;
      cursor.style.setProperty('--cursor', pinched ? '#ff6b81' : '#73f5ff');
      cursor.style.transform = `translate(-50%, -50%) scale(${pinched ? 1.6 : 1})`;
    }

    const handSdkReady = typeof window.Hands !== 'undefined';
    const cameraUtilsReady = typeof window.Camera !== 'undefined';
    let hands = null;
    if (handSdkReady) {
      hands = new Hands({
        locateFile: (file) => {
          const url = `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
          console.log('[Hands] locateFile:', url);
          return url;
        }
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: isMobileDevice ? 0 : 1,
        minDetectionConfidence: isMobileDevice ? 0.5 : HAND_DETECTION_CONFIDENCE,
        minTrackingConfidence: isMobileDevice ? 0.5 : HAND_TRACKING_CONFIDENCE
      });

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
          cursor.style.opacity = handEnabled ? '0.3' : '0';
          resetFilter();
          palmHoldSince = 0;
          return;
        }
        const landmarks = results.multiHandLandmarks[0];
        const tipIndex = landmarks[8];
        const tipThumb = landmarks[4];
        const dx = tipIndex.x - tipThumb.x;
        const dy = tipIndex.y - tipThumb.y;
        const rawPinch = Math.sqrt(dx * dx + dy * dy);

        // ── 时间步长 ──
        const now = performance.now();
        const dt = lastFilterTime ? Math.min((now - lastFilterTime) / 16.67, 3) : 1;
        lastFilterTime = now;

        // ── EMA 滤波 ──
        const filtered = applyFilter(tipIndex.x, tipIndex.y, rawPinch, dt);
        const pinched = filtered.pinch < PINCH_THRESHOLD;
        updateCursor(filtered.x, filtered.y, pinched);

        // ── 捏合抽卡 ──
        if (pinched && !isPinched && (canDraw || (activeCosmicEvent && activeCosmicEvent.id === 'cosmic_blessing' && activeCosmicEvent.drawsLeft > 0))) {
          canDraw = false;
          drawCard('捏合');
          setTimeout(() => { canDraw = true; }, DRAW_COOLDOWN_MS);
        }

        // ── 速度滑动：累积距离，按速度切换多张 ──
        if (!pinched && lastTipX !== null && archiveCards.length > 1) {
          const sensitivity = getSwipeSensitivity();
          const rawDelta = (filtered.x - lastTipX) * sensitivity;
          swipeVelX = swipeVelX * 0.5 + rawDelta * 0.5; // 速度也做低通滤波
          swipeAccum += swipeVelX;

          // 超时结算
          if (now - swipeAccumTimer > SWIPE_ACCUM_TIMEOUT && Math.abs(swipeAccum) > SWIPE_MULTITHRESHOLD * 0.5) {
            const direction = swipeAccum > 0 ? -1 : 1; // 手向右 → 卡向左
            const cardsToSwitch = Math.min(
              Math.max(1, Math.floor(Math.abs(swipeAccum) / SWIPE_MULTITHRESHOLD)),
              SWIPE_MAX_CARDS
            );
            for (let i = 0; i < cardsToSwitch; i++) {
              setTimeout(() => shiftFocus(direction, '手势滑动'), i * 60);
            }
            swipeAccum = 0;
            swipeAccumTimer = now;
          }
          // 实时累积超时重置
          if (Math.abs(swipeAccum) < SWIPE_MULTITHRESHOLD * 0.3) {
            swipeAccumTimer = now;
          }
        }

        if (isOpenPalm(landmarks, filtered.pinch)) {
          if (!palmHoldSince) {
            palmHoldSince = now;
          } else if (now - palmHoldSince > PALM_BURST_HOLD_MS && now - lastBurstAt > BURST_COOLDOWN_MS) {
            palmHoldSince = 0;
            lastBurstAt = now;
            drawBurst(BURST_COUNT, '开掌连抽');
            toast('识别到开掌手势，触发连抽');
          }
        } else {
          palmHoldSince = 0;
        }

        lastTipX = filtered.x;
        isPinched = pinched;
      });
    } else {
      gestureBtn.textContent = '手势资源加载失败';
    }

    async function startMediaPipeLoopWithStream(stream) {
      mediaStream = stream;
      videoElement.srcObject = stream;
      videoElement.muted = true;
      videoElement.setAttribute('playsinline', 'true');
      videoElement.setAttribute('autoplay', 'true');
      await videoElement.play();

      const loop = async () => {
        if (!handEnabled) return;
        if (videoElement.readyState >= 2) {
          await hands.send({ image: videoElement });
        }
        mediaPipeRafId = requestAnimationFrame(loop);
      };
      mediaPipeRafId = requestAnimationFrame(loop);
    }

    function stopCameraFeed() {
      resetFilter();
      if (cameraUtil && typeof cameraUtil.stop === 'function') {
        cameraUtil.stop();
      }
      cameraUtil = null;
      if (mediaPipeRafId) {
        cancelAnimationFrame(mediaPipeRafId);
        mediaPipeRafId = 0;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }
      mediaStream = null;
      videoElement.srcObject = null;
    }

    async function startGestureCamera() {
      const cameraWidth = isMobileDevice ? MOBILE_CAMERA_WIDTH : CAMERA_WIDTH;
      const cameraHeight = isMobileDevice ? MOBILE_CAMERA_HEIGHT : CAMERA_HEIGHT;

      if (cameraUtilsReady) {
        try {
          cameraUtil = new Camera(videoElement, {
            onFrame: async () => {
              await hands.send({ image: videoElement });
            },
            width: cameraWidth,
            height: cameraHeight,
            facingMode: 'user'
          });
          await cameraUtil.start();
          return;
        } catch (error) {
          console.warn('CameraUtils 启动失败，尝试 getUserMedia 回退:', error);
          cameraUtil = null;
        }
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('当前浏览器不支持 getUserMedia');
      }

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: 'user' },
          width: { ideal: cameraWidth },
          height: { ideal: cameraHeight }
        }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      await startMediaPipeLoopWithStream(stream);
    }

    gestureBtn.addEventListener('click', async () => {
      if (!handSdkReady || !hands) {
        toast('手势资源加载失败，请检查网络后刷新');
        return;
      }
      if (handEnabled) return;
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        toast('移动端摄像头需 HTTPS 或 localhost 环境');
        return;
      }
      handEnabled = true;
      resetFilter();
      gestureBtn.textContent = '手势识别已开启';
      gestureBtn.disabled = true;
      try {
        await startGestureCamera();
        gestureHintEl.textContent = '手势提示：捏合抽卡，横向挥手切卡，保持开掌可连抽';
        toast(`手势已连接：${isMobileDevice ? '移动端摄像头已启用' : '捏合抽卡，左右挥手切卡'}`);
      } catch (err) {
        stopCameraFeed();
        gestureBtn.disabled = false;
        gestureBtn.textContent = '唤醒手势抽卡';
        handEnabled = false;
        toast(`手势启动失败：${err && err.message ? err.message : '请检查摄像头权限'}`);
      }
    });

    prevCardBtn.addEventListener('click', () => shiftFocus(-1, '按钮'));
    nextCardBtn.addEventListener('click', () => shiftFocus(1, '按钮'));
    hudPrevBtn.addEventListener('click', () => shiftFocus(-1, 'HUD'));
    hudNextBtn.addEventListener('click', () => shiftFocus(1, 'HUD'));
    multiDrawBtn.addEventListener('click', () => drawBurst(BURST_COUNT, '按钮连抽'));

    let pointerDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;

    canvas.addEventListener('pointerdown', (event) => {
      pointerDown = true;
      pointerStartX = event.clientX;
      pointerStartY = event.clientY;
      if (!handEnabled) {
        updateCursor(event.clientX / window.innerWidth, event.clientY / window.innerHeight, false);
      }
    });

    window.addEventListener('pointermove', (event) => {
      if (!handEnabled) {
        updateCursor(event.clientX / window.innerWidth, event.clientY / window.innerHeight, false);
      }
    });

    window.addEventListener('pointerup', (event) => {
      if (!pointerDown) return;
      pointerDown = false;
      const deltaX = event.clientX - pointerStartX;
      const deltaY = event.clientY - pointerStartY;
      if (Math.abs(deltaX) > POINTER_SWIPE_THRESHOLD_PX && Math.abs(deltaX) > Math.abs(deltaY)) {
        shiftFocus(deltaX > 0 ? -1 : 1, '拖拽');
      } else {
        // Cosmic blessing: free draw (skip cooldown)
        if (activeCosmicEvent && activeCosmicEvent.id === 'cosmic_blessing' && activeCosmicEvent.drawsLeft > 0) {
          drawCard('点击');
        } else {
          drawCard('点击');
        }
      }
    });

    canvas.addEventListener('wheel', (event) => {
      if (Math.abs(event.deltaY) < 4) return;

    let lastFrameTime = performance.now();

      parallaxX += (targetParallaxX - parallaxX) * 0.03;

      starField.rotation.x += 0.00008;
      starField.position.x = parallaxX * 3;
      starField.position.y = -parallaxY * 2;

      point.position.x = Math.sin(now * 0.0006) * 12;

      if (composer) {

    // ══════════════════════════════════════════════
    //  🎡 Feature 2: Fortune Wheel (命运之轮)
    // ══════════════════════════════════════════════
    const wheelOverlay = document.getElementById('wheelOverlay');
    const wheelCanvas = document.getElementById('wheelCanvas');
    const wheelCtx = wheelCanvas.getContext('2d');
    const wheelResultEl = document.getElementById('wheelResult');
    const wheelSpinBtn = document.getElementById('wheelSpinBtn');
    const wheelCloseBtn = document.getElementById('wheelCloseBtn');
    const wheelCooldownEl = document.getElementById('wheelCooldown');
    const wheelBtn = document.getElementById('wheelBtn');

    const WHEEL_SEGMENTS = [
      { label: '普通加成', color: '#8a9bb0', rarity: 'common' },
      { label: '稀有加成', color: '#4a9eff', rarity: 'rare' },
      { label: '史诗加成', color: '#b44aff', rarity: 'epic' },
      { label: '传说加成', color: '#ffc832', rarity: 'legendary' },
      { label: '神话加成', color: '#ff3355', rarity: 'mythic' },
      { label: '无效果',   color: '#3a3a4a', rarity: null },
    ];
    const WHEEL_SEG_COUNT = WHEEL_SEGMENTS.length;
    const WHEEL_ARC = (Math.PI * 2) / WHEEL_SEG_COUNT;

    let wheelAngle = 0;
    let wheelSpinning = false;
    let wheelLastSpinTime = 0;
    const WHEEL_COOLDOWN_MS = 30000;
    let fortuneBoostRarity = null; // null or rarity key

    function drawWheel() {
      const cx = 160, cy = 160, radius = 140;
      wheelCtx.clearRect(0, 0, 320, 320);
      WHEEL_SEGMENTS.forEach((seg, i) => {
        const startAngle = wheelAngle + i * WHEEL_ARC;
        const endAngle = startAngle + WHEEL_ARC;
        wheelCtx.beginPath();
        wheelCtx.moveTo(cx, cy);
        wheelCtx.arc(cx, cy, radius, startAngle, endAngle);
        wheelCtx.closePath();
        wheelCtx.fillStyle = seg.color + 'cc';
        wheelCtx.fill();
        wheelCtx.strokeStyle = 'rgba(255,255,255,0.3)';
        wheelCtx.lineWidth = 1.5;
        wheelCtx.stroke();
        // Label
        wheelCtx.save();
        wheelCtx.translate(cx, cy);
        wheelCtx.rotate(startAngle + WHEEL_ARC / 2);
        wheelCtx.fillStyle = '#fff';
        wheelCtx.font = 'bold 13px "Noto Sans SC", sans-serif';
        wheelCtx.textAlign = 'center';
        wheelCtx.fillText(seg.label, radius * 0.6, 4);
        wheelCtx.restore();
      });
      // Center circle
      wheelCtx.beginPath();
      wheelCtx.arc(cx, cy, 18, 0, Math.PI * 2);
      wheelCtx.fillStyle = 'rgba(255,255,255,0.15)';
      wheelCtx.fill();
      wheelCtx.strokeStyle = 'rgba(255,255,255,0.4)';
      wheelCtx.lineWidth = 2;
      wheelCtx.stroke();
      // Pointer
      wheelCtx.beginPath();
      wheelCtx.moveTo(cx, cy - radius - 8);
      wheelCtx.lineTo(cx - 10, cy - radius + 8);
      wheelCtx.lineTo(cx + 10, cy - radius + 8);
      wheelCtx.closePath();
      wheelCtx.fillStyle = '#fff';
      wheelCtx.fill();
    }

    function spinWheel() {
      if (wheelSpinning) return;
      const now = Date.now();
      if (now - wheelLastSpinTime < WHEEL_COOLDOWN_MS) {
        const remaining = Math.ceil((WHEEL_COOLDOWN_MS - (now - wheelLastSpinTime)) / 1000);
        wheelCooldownEl.textContent = `冷却中... ${remaining}秒后可再次旋转`;
        return;
      }
      wheelSpinning = true;
      wheelResultEl.textContent = '';
      wheelResultEl.className = '';
      const spinDuration = 4000;
      const totalRotation = Math.PI * 2 * (5 + Math.random() * 5); // 5-10 full rotations
      const startAngle = wheelAngle;
      const startTime = performance.now();

      function animateSpin(timestamp) {
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        // Ease out cubic
        const eased = 1 - Math.pow(1 - progress, 3);
        wheelAngle = startAngle + totalRotation * eased;
        drawWheel();
        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          wheelSpinning = false;
          wheelLastSpinTime = Date.now();
          // Determine result: the segment at the top (pointer at -PI/2)
          const normalizedAngle = (((-wheelAngle - Math.PI / 2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          const segIndex = Math.floor(normalizedAngle / WHEEL_ARC) % WHEEL_SEG_COUNT;
          const result = WHEEL_SEGMENTS[segIndex];
          if (result.rarity) {
            fortuneBoostRarity = result.rarity;
            wheelResultEl.textContent = `✨ ${result.label}！下次抽卡该稀有度权重×3 ✨`;
            wheelResultEl.style.color = result.color;
            wheelResultEl.className = 'glow-text';
          } else {
            fortuneBoostRarity = null;
            wheelResultEl.textContent = '无效果...命运如此捉弄人';
            wheelResultEl.style.color = '#888';
            wheelResultEl.className = '';
          }
          wheelCooldownEl.textContent = '30秒冷却中...';
          startWheelCooldownTimer();
        }
      }
      requestAnimationFrame(animateSpin);
    }

    let wheelCooldownInterval = null;
    function startWheelCooldownTimer() {
      if (wheelCooldownInterval) clearInterval(wheelCooldownInterval);
      wheelCooldownInterval = setInterval(() => {
        const elapsed = Date.now() - wheelLastSpinTime;
        if (elapsed >= WHEEL_COOLDOWN_MS) {
          wheelCooldownEl.textContent = '可以旋转了！';
          clearInterval(wheelCooldownInterval);
          wheelCooldownInterval = null;
        } else {
          wheelCooldownEl.textContent = `冷却中... ${Math.ceil((WHEEL_COOLDOWN_MS - elapsed) / 1000)}秒`;
        }
      }, 1000);
    }

    wheelBtn.addEventListener('click', () => {

    wheelSpinBtn.addEventListener('click', spinWheel);

    // ── Patched draw function (respects fortune boost & cosmic events) ──
    function patchedDrawRandomCard() {
      // Supernova: guarantee epic+
      if (activeCosmicEvent && activeCosmicEvent.id === 'supernova' && activeCosmicEvent.drawsLeft > 0) {
        const epicPlus = ['epic', 'legendary', 'mythic'];
        const rarityKey = epicPlus[Math.floor(Math.random() * epicPlus.length)];
        const candidates = CARD_POOL.filter(c => c.rarity === rarityKey);
        return candidates[Math.floor(Math.random() * candidates.length)] || CARD_POOL[0];
      }

      // Build weights
      let weights = {};
      if (darkMatterWeights) {
        weights = { ...darkMatterWeights };
      } else {
        RARITY_KEYS.forEach(k => { weights[k] = RARITY[k].weight; });
      }

      // Fortune wheel boost: 3x weight for boosted rarity
      if (fortuneBoostRarity) {
        weights[fortuneBoostRarity] = (weights[fortuneBoostRarity] || RARITY[fortuneBoostRarity].weight) * 3;
      }

      // Meteor shower: +50% rare or better
      if (activeCosmicEvent && activeCosmicEvent.id === 'meteor_shower' && activeCosmicEvent.drawsLeft > 0) {
        ['rare', 'epic', 'legendary', 'mythic'].forEach(k => {
          weights[k] = (weights[k] || RARITY[k].weight) * 1.5;
        });
      }

      const totalW = Object.values(weights).reduce((s, v) => s + v, 0);
      let r = Math.random() * totalW;
      for (const key of RARITY_KEYS) {
        r -= (weights[key] || 0);
        if (r <= 0) {
          const pool = CARD_POOL.filter(c => c.rarity === key);
          return pool[Math.floor(Math.random() * pool.length)] || CARD_POOL[0];
        }
      }
      return CARD_POOL[0];
    }

    // ══════════════════════════════════════════════
    //  ⚡ Feature 3: Card Fusion System (融合)
    // ══════════════════════════════════════════════
    const fusionOverlay = document.getElementById('fusionOverlay');
    const fusionBtn = document.getElementById('fusionBtn');
    const fusionCloseBtn = document.getElementById('fusionCloseBtn');
    const fusionSlot1 = document.getElementById('fusionSlot1');
    const fusionSlot2 = document.getElementById('fusionSlot2');
    const fusionGoBtn = document.getElementById('fusionGoBtn');
    const fusionMsg = document.getElementById('fusionMsg');
    const fusionRarityList = document.getElementById('fusionRarityList');
    const fusionPickOverlay = document.getElementById('fusionPickOverlay');
    const fusionPickGrid = document.getElementById('fusionPickGrid');
    const fusionPickCloseBtn = document.getElementById('fusionPickCloseBtn');

    let fusionSelected = [null, null]; // [cardName1, cardName2]
    let fusionPickingSlot = 0; // 0 or 1

    // Collection with counts for fusion
    function getCollectionCounts() {
      const counts = {};
      archiveCards.forEach(entry => {
        if (!counts[entry.name]) counts[entry.name] = 0;
        counts[entry.name]++;
      });
      return counts;
    }

    function renderFusionSlots() {
      [fusionSlot1, fusionSlot2].forEach((slot, idx) => {
        const sel = fusionSelected[idx];
        if (sel) {
          const card = CARD_POOL.find(c => c.name === sel);
          const r = RARITY[card.rarity];
          slot.innerHTML = `<div style="color:${r.border};font-weight:600;">${sel}</div><div style="font-size:11px;color:${r.border};">${r.label} ${'★'.repeat(r.stars)}</div>`;
          slot.classList.add('selected');
          slot.style.borderColor = r.border;
        } else {
          slot.innerHTML = `选择卡牌${idx + 1}`;
          slot.classList.remove('selected');
          slot.style.borderColor = '';
          slot.style.opacity = '0.7';
        }
      });
      fusionGoBtn.disabled = !(fusionSelected[0] && fusionSelected[1]);
    }

    function renderFusionRarityInfo() {
      const counts = getCollectionCounts();
      const rarityCounts = {};
      RARITY_KEYS.forEach(k => { rarityCounts[k] = 0; });
      Object.keys(counts).forEach(name => {
        const card = CARD_POOL.find(c => c.name === name);
        if (card) rarityCounts[card.rarity] += counts[name];
      });
      let html = '<div style="font-size:12px;opacity:0.8;">当前卡牌稀有度统计：</div>';
      RARITY_KEYS.forEach(k => {
        const r = RARITY[k];
        html += `<div style="font-size:12px;color:${r.border};">${r.label}：${rarityCounts[k]}张</div>`;
      });
      fusionRarityList.innerHTML = html;
    }

    function openFusionPick(slotIdx) {
      fusionPickingSlot = slotIdx;
      fusionPickGrid.innerHTML = '';
      const counts = getCollectionCounts();
      const otherSlot = slotIdx === 0 ? 1 : 0;
      const otherName = fusionSelected[otherSlot];
      let targetRarity = null;
      if (otherName) {
        const otherCard = CARD_POOL.find(c => c.name === otherName);
        targetRarity = otherCard.rarity;
      }

      // Show cards from collection that match the needed rarity
      const availableCards = [];
      Object.keys(counts).forEach(name => {
        const card = CARD_POOL.find(c => c.name === name);
        if (!card) return;
        if (card.rarity === 'mythic') return; // can't fuse mythic
        if (targetRarity && card.rarity !== targetRarity) return;
        const count = counts[name];
        // If this card is already selected in the other slot, need at least 2
        const isOther = (name === otherName);
        const available = isOther ? count - 1 : count;
        if (available > 0) {
          availableCards.push({ name: card.name, rarity: card.rarity, count: available });
        }
      });

      if (availableCards.length === 0) {
        fusionPickGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;opacity:0.6;font-size:13px;">没有可用的卡牌。需要两张相同稀有度的卡牌才能融合。</div>';
      } else {
        availableCards.forEach(c => {
          const r = RARITY[c.rarity];
          const div = document.createElement('div');
          div.className = 'fusion-pick-card';
          div.innerHTML = `<div style="color:${r.border};font-weight:600;">${c.name}</div><div style="font-size:10px;color:${r.border};">${r.label} ×${c.count}</div>`;
          div.addEventListener('click', () => {
            fusionSelected[fusionPickingSlot] = c.name;
            renderFusionSlots();
            fusionPickOverlay.classList.add('hidden');
          });
          fusionPickGrid.appendChild(div);
        });
      }
      fusionPickOverlay.classList.remove('hidden');
    }

    fusionSlot1.addEventListener('click', () => openFusionPick(0));
    fusionSlot2.addEventListener('click', () => openFusionPick(1));
    fusionPickCloseBtn.addEventListener('click', () => fusionPickOverlay.classList.add('hidden'));

    function performFusion() {
      const name1 = fusionSelected[0];
      const name2 = fusionSelected[1];
      if (!name1 || !name2) return;
      const card1 = CARD_POOL.find(c => c.name === name1);
      const card2 = CARD_POOL.find(c => c.name === name2);
      if (!card1 || !card2) return;
      if (card1.rarity !== card2.rarity) {
        fusionMsg.textContent = '两张卡牌稀有度不同，无法融合！';
        fusionMsg.style.color = '#ff6b81';
        return;
      }
      if (card1.rarity === 'mythic') {
        fusionMsg.textContent = '神话卡牌无法继续融合！';
        fusionMsg.style.color = '#ff6b81';
        return;
      }

      // Find and remove 2 cards from archiveCards
      let removed = 0;
      const toRemove = [];
      for (let i = archiveCards.length - 1; i >= 0 && removed < 2; i--) {
        if (archiveCards[i].name === name1 || archiveCards[i].name === name2) {
          // Make sure we remove one of each (or two of the same if name1===name2)
          if (removed === 0 || (name1 === name2) || archiveCards[i].name === name2) {
            toRemove.push(i);
            removed++;
          }
        }
      }
      if (removed < 2) {
        fusionMsg.textContent = '卡牌数量不足！';
        fusionMsg.style.color = '#ff6b81';
        return;
      }

      // Fusion animation
      fusionGoBtn.disabled = true;
      fusionMsg.textContent = '融合中...';
      fusionMsg.style.color = 'var(--accent)';

      // Animate slots
      gsap.to(fusionSlot1, { scale: 0.8, opacity: 0.5, duration: 0.3 });
      gsap.to(fusionSlot2, { scale: 0.8, opacity: 0.5, duration: 0.3 });

      setTimeout(() => {
        // Remove cards from archive
        toRemove.sort((a, b) => b - a);
        toRemove.forEach(idx => {
          const entry = archiveCards[idx];
          cardGroup.remove(entry.mesh);
          entry.geo.dispose();
          entry.mat.dispose();
          entry.tex.dispose();
          archiveCards.splice(idx, 1);
        });
        focusIndex = Math.max(0, Math.min(focusIndex, archiveCards.length - 1));
        layoutArchiveCards(false);

        // Determine next rarity
        const currentRarityIdx = RARITY_KEYS.indexOf(card1.rarity);
        const nextRarityKey = RARITY_KEYS[currentRarityIdx + 1];
        const candidates = CARD_POOL.filter(c => c.rarity === nextRarityKey);
        const resultCard = candidates[Math.floor(Math.random() * candidates.length)];

        // Draw the fused card
        const rainbowMode = rainbowModeEl.checked;
        const r = RARITY[nextRarityKey];
        const tex = textureFromBase64(null, resultCard.name, nextRarityKey, rainbowMode);
        const geo = new THREE.PlaneGeometry(8, 12);
        const mat = new THREE.MeshStandardMaterial({
          map: tex,
          metalness: nextRarityKey === 'mythic' ? 0.3 : 0.18,
          roughness: rainbowMode ? 0.55 : 0.38,
          emissive: rainbowMode ? 0x050810 : parseInt(r.glow.slice(1), 16),
          emissiveIntensity: 0.6,
          transparent: true,
          opacity: 1
        });
        const card = new THREE.Mesh(geo, mat);
        card.position.set(0, 0, -5);
        card.scale.set(0.01, 0.01, 0.01);
        cardGroup.add(card);
        archiveCards.push({ name: resultCard.name, rarity: nextRarityKey, mesh: card, geo, mat, tex, createdAt: Date.now() });
        collectedCards.add(resultCard.name);
        focusIndex = archiveCards.length - 1;

        // Fusion reveal animation
        const tl = gsap.timeline();
        tl.to(card.scale, { x: 0.66, y: 0.66, z: 0.66, duration: 0.6, ease: 'elastic.out(1, 0.5)' })
          .to(card.position, { z: 1.5, y: 0.4, duration: 0.4, ease: 'power2.out' }, '<')
          .to(card.rotation, { y: Math.PI * 2, duration: 0.8, ease: 'power2.out' }, '<');

        spawnParticleBurst(card.position.clone(), parseInt(r.border.slice(1), 16), 80);
        playDrawSound(nextRarityKey);
        triggerScreenFlash(r.border);

        setTimeout(() => layoutArchiveCards(true), 800);

        fusionMsg.innerHTML = `<span style="color:${r.border};">融合成功！获得 [${r.label}] ${resultCard.name} ${'★'.repeat(r.stars)}</span>`;
        fusionSelected = [null, null];
        renderFusionSlots();
        gsap.to(fusionSlot1, { scale: 1, opacity: 0.7, duration: 0.3 });
        gsap.to(fusionSlot2, { scale: 1, opacity: 0.7, duration: 0.3 });
        renderFusionRarityInfo();
      }, 800);
    }

    fusionGoBtn.addEventListener('click', performFusion);

    fusionBtn.addEventListener('click', () => {
      fusionSelected = [null, null];
      renderFusionSlots();
      renderFusionRarityInfo();
      fusionMsg.textContent = '';
