        duration: null,
        drawsLeft: 1,
      },
    ];

    let activeCosmicEvent = null;
    let cosmicEventTimer = null;
    let darkMatterWeights = null;

    function triggerCosmicEvent() {
      const event = COSMIC_EVENTS[Math.floor(Math.random() * COSMIC_EVENTS.length)];
      activeCosmicEvent = { ...event, startTime: Date.now() };

      // Show banner
      cosmicBanner.style.background = `linear-gradient(90deg, ${event.color}44, ${event.color}88, ${event.color}44)`;
      cosmicBanner.style.color = event.color;
      cosmicBanner.style.boxShadow = `0 0 40px ${event.color}44`;
      cosmicBanner.textContent = `🌌 ${event.name} — ${event.description}`;
      cosmicBanner.style.top = '0px';

      setTimeout(() => {
        cosmicBanner.style.top = '-80px';
      }, 4000);

      // Show indicator
      eventDot.style.background = event.color;
      eventLabel.textContent = `${event.name} 生效中`;
      eventLabel.style.color = event.color;
      eventIndicator.style.display = 'block';

      // Handle dark matter
      if (event.id === 'dark_matter') {
        // Shuffle weights
        const weights = RARITY_KEYS.map(k => RARITY[k].weight);
        for (let i = weights.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [weights[i], weights[j]] = [weights[j], weights[i]];
        }
        darkMatterWeights = {};
        RARITY_KEYS.forEach((k, i) => { darkMatterWeights[k] = weights[i]; });
        setTimeout(() => {
          if (activeCosmicEvent && activeCosmicEvent.id === 'dark_matter') {
            darkMatterWeights = null;
            activeCosmicEvent = null;
            eventIndicator.style.display = 'none';
          }
        }, event.duration);
      }

      // Schedule next event
      scheduleNextCosmicEvent();
    }

    function scheduleNextCosmicEvent() {
      if (cosmicEventTimer) clearTimeout(cosmicEventTimer);
      const delay = (45 + Math.random() * 45) * 1000; // 45-90 seconds
      cosmicEventTimer = setTimeout(triggerCosmicEvent, delay);
    }

    // Start cosmic events after a delay
    setTimeout(scheduleNextCosmicEvent, 30000);

    // ══════════════════════════════════════════════
    //  🔍 Feature 5: Card Detail Popup (卡牌详情)
    // ══════════════════════════════════════════════
    const detailOverlay = document.getElementById('detailOverlay');
    const detail3D = document.getElementById('detail3D');
    const detailInfo = document.getElementById('detailInfo');
    const detailCloseBtn = document.getElementById('detailCloseBtn');
    const detailBtn = document.getElementById('detailBtn');

    let detailRenderer = null;
    let detailScene = null;
    let detailCamera = null;
    let detailCard = null;
    let detailAnimId = null;

    function openCardDetail() {
      if (focusIndex < 0 || !archiveCards[focusIndex]) {
        toast('请先抽一张卡牌！');
        return;
      }
      const entry = archiveCards[focusIndex];
      const card = CARD_POOL.find(c => c.name === entry.name) || { name: entry.name, rarity: entry.rarity, flavor: '未知的宇宙力量。' };
      const r = RARITY[card.rarity];
      const powerLevel = Math.floor(Math.random() * 9000 + 1000);

      // Setup 3D detail view
      if (!detailRenderer) {
        detailRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        detailRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        detailScene = new THREE.Scene();
        detailCamera = new THREE.PerspectiveCamera(50, 200 / 300, 0.1, 100);
        detailCamera.position.set(0, 0, 5);
        const dAmbient = new THREE.AmbientLight(0xffffff, 0.7);
        const dPoint = new THREE.PointLight(0x9dd6ff, 1.2, 50);
        dPoint.position.set(3, 4, 5);
        detailScene.add(dAmbient, dPoint);
      }
      detailRenderer.setSize(200, 300);
      detail3D.innerHTML = '';
      detail3D.appendChild(detailRenderer.domElement);

      // Remove old card
      if (detailCard) {
        detailScene.remove(detailCard);
        detailCard.geometry.dispose();
        detailCard.material.dispose();
      }

      // Create card for detail view
      const tex = textureFromBase64(null, card.name, card.rarity, false);
      const geo = new THREE.PlaneGeometry(3, 4.5);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        metalness: 0.2,
        roughness: 0.4,
        emissive: parseInt(r.glow.slice(1), 16),
        emissiveIntensity: 0.4,
      });
      detailCard = new THREE.Mesh(geo, mat);
      detailScene.add(detailCard);

      // Start rotation animation
      if (detailAnimId) cancelAnimationFrame(detailAnimId);
      function animateDetail() {
        detailAnimId = requestAnimationFrame(animateDetail);
        if (detailCard) {
          detailCard.rotation.y += 0.015;
        }
        detailRenderer.render(detailScene, detailCamera);
      }
      animateDetail();

      // Show info
      detailInfo.innerHTML = `
        <div class="detail-stat-row"><span>名称</span><strong style="color:${r.border};">${card.name}</strong></div>
        <div class="detail-stat-row"><span>稀有度</span><span style="color:${r.border};">${r.label}</span></div>
        <div class="detail-stat-row"><span>星级</span><span style="color:${r.border};">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
        <div class="detail-stat-row"><span>力量等级</span><span style="color:${r.border};">${powerLevel}</span></div>
        <div class="detail-flavor">"${card.flavor || '未知的宇宙力量。'}"</div>
      `;

      detailOverlay.classList.remove('hidden');
    }

    detailBtn.addEventListener('click', openCardDetail);
    detailCloseBtn.addEventListener('click', () => {
      detailOverlay.classList.add('hidden');
      if (detailAnimId) {
        cancelAnimationFrame(detailAnimId);
        detailAnimId = null;
      }
    });

    // Double-click on canvas to show detail
    canvas.addEventListener('dblclick', () => {
      if (focusIndex >= 0 && archiveCards[focusIndex]) {
        openCardDetail();
      }
    });

    // ══════════════════════════════════════════════
    //  🔧 Patched draw logic note
    // ══════════════════════════════════════════════
    // drawCard() calls patchedDrawRandomCard() which respects:
    // - fortuneBoostRarity (from Fortune Wheel)
    // - darkMatterWeights (from Dark Matter Tide event)
    // - activeCosmicEvent (meteor_shower, supernova, cosmic_blessing)
    // Post-draw: fortuneBoostRarity resets after 1 draw,
    //            cosmic event drawsLeft decrements after each draw.

    })();
  </script>
</body>
</html>
